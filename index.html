<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Jack – Casino (CHF)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🤖</span>
        <h1>BLACK JACK <span class="badge">CHF</span></h1>
      </div>

      <div class="wallet-panel">
        <div class="wallet-box">
          <span class="wallet-label">Guthaben</span>
          <span class="wallet-amount" id="balance-display">CHF 1'000.00</span>
        </div>
        <button class="btn btn-gold btn-sm" id="topup-btn" title="Gratis Spielgeld nachladen">
          + CHF 1'000
        </button>
        <button class="btn btn-ghost btn-sm" id="sound-toggle" aria-label="Ton ein/aus" title="Ton ein/aus">
          🔊
        </button>
      </div>
    </header>

    <!-- Main Casino Table -->
    <main class="table-felt">
      <div class="table-rim"></div>

      <!-- Dealer / Robot Area -->
      <section class="zone dealer-zone" aria-label="Roboter-Dealer">
        <div class="robot-header">
          <div class="robot-avatar" id="robot-avatar">
            <div class="robot-eyes">
              <span></span><span></span>
            </div>
          </div>
          <div class="robot-info">
            <div class="robot-title-row">
              <span class="zone-title">ROBO-CROUPIER</span>
              <span class="score-pill" id="dealer-score">0</span>
            </div>
            <p class="robot-speech" id="robot-speech">
              Setze deine Chips und drücke auf «Austeilen».
            </p>
          </div>
        </div>

        <div class="cards-row" id="dealer-cards" aria-live="polite"></div>
      </section>

      <!-- Center Table -->
      <section class="table-center">
        <div class="result-banner hidden" id="result-banner" role="status" aria-live="assertive">
          <span id="result-title"></span>
          <span id="result-subtitle"></span>
        </div>

        <div class="betting-spot" id="betting-spot">
          <div class="bet-circle" id="bet-circle" title="Klicken, um obersten Chip zu entfernen">
            <div class="table-chip-stack" id="table-chip-stack"></div>
            <span class="bet-circle-placeholder" id="bet-circle-placeholder">EINSATZ</span>
          </div>
          <div class="bet-pot">
            <label class="pot-label" for="bet-input">Einsatz (CHF)</label>
            <input
              type="number"
              id="bet-input"
              class="bet-input"
              min="0"
              step="1"
              value="0"
              aria-label="Dein Einsatz in CHF"
            />
          </div>
        </div>
      </section>

      <!-- Player Area -->
      <section class="zone player-zone" aria-label="Spieler">
        <div class="player-hands" id="player-hands"></div>
      </section>
    </main>

    <!-- Controls Bar -->
    <footer class="controls-bar">
      <!-- Betting Controls -->
      <div class="betting-controls" id="betting-controls">
        <div class="chips-rack" aria-label="CHF Poker Chips">
          <button class="chip chip-1" data-value="1" title="CHF 1 setzen"><span>1</span></button>
          <button class="chip chip-5" data-value="5" title="CHF 5 setzen"><span>5</span></button>
          <button class="chip chip-10" data-value="10" title="CHF 10 setzen"><span>10</span></button>
          <button class="chip chip-25" data-value="25" title="CHF 25 setzen"><span>25</span></button>
          <button class="chip chip-50" data-value="50" title="CHF 50 setzen"><span>50</span></button>
          <button class="chip chip-100" data-value="100" title="CHF 100 setzen"><span>100</span></button>
          <button class="chip chip-500" data-value="500" title="CHF 500 setzen"><span>500</span></button>
        </div>

        <div class="bet-actions">
          <button class="btn btn-ghost" id="clear-bet-btn">Löschen</button>
          <button class="btn btn-ghost" id="rebet-btn">Letzter</button>
          <button class="btn btn-ghost" id="allin-btn">All-In</button>
          <button class="btn btn-primary btn-lg" id="deal-btn" disabled>Austeilen</button>
        </div>
      </div>

      <!-- Playing Controls -->
      <div class="playing-controls hidden" id="playing-controls">
        <button class="btn btn-primary btn-lg" id="hit-btn">Karte</button>
        <button class="btn btn-secondary btn-lg" id="stand-btn">Halten</button>
        <button class="btn btn-gold btn-lg" id="double-btn">Verdoppeln</button>
        <button class="btn btn-ghost btn-lg" id="split-btn">Teilen</button>
      </div>

      <!-- Next Round Controls -->
      <div class="next-controls hidden" id="next-controls">
        <button class="btn btn-primary btn-lg" id="new-round-btn">Nächste Runde</button>
        <button class="btn btn-gold btn-lg" id="quick-rebet-btn">Nochmal setzen</button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
